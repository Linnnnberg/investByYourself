# Main server block routing API requests to backend microservices.
#
# Two server blocks are provided:
#   1. HTTP (port 80)  - redirects all traffic to HTTPS once SSL is enabled.
#   2. HTTPS (port 443) - terminates TLS and proxies to backends.
#
# To run without TLS during initial bring-up, comment out the redirect in the
# port 80 server and uncomment the location blocks inside it. To enable TLS,
# place certificates in services/nginx/ssl/ and uncomment the HTTPS server.

# ---- HTTP (port 80) ----------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Health endpoint for the gateway itself (no upstream dependency).
    location = /gateway/health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Redirect all other traffic to HTTPS once SSL is configured.
    # During initial bring-up (no SSL yet) you can comment this redirect and
    # uncomment the API location blocks below.
    location / {
        return 301 https://$host$request_uri;
    }

    # --- Bring-up mode (no TLS) - uncomment when SSL is not yet configured ---
    # include /etc/nginx/conf.d/_locations.inc;
}

