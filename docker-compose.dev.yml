# InvestByYourself Development Environment
# Docker Compose for local development

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: investbyyourself-postgres-dev
    environment:
      POSTGRES_DB: investbyyourself
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    networks:
      - investbyyourself-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d investbyyourself"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: investbyyourself-redis-dev
    command: redis-server --requirepass ${REDIS_PASSWORD:-dev_redis_123}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - investbyyourself-dev
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-dev_redis_123} ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # API Service
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: investbyyourself-api-dev
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-dev_password_123}@postgres:5432/investbyyourself
      - REDIS_URL=redis://:${REDIS_PASSWORD:-dev_redis_123}@redis:6379/0
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD:-dev_redis_123}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev_jwt_secret_key}
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY:-your_alpha_vantage_api_key}
      - FRED_API_KEY=${FRED_API_KEY:-your_fred_api_key}
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - /app/__pycache__
    networks:
      - investbyyourself-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: investbyyourself-frontend-dev
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      # Supabase is optional - only set if environment variables are provided
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - investbyyourself-dev
    depends_on:
      - api
    restart: unless-stopped

  # ETL Service (Optional for development)
  etl:
    build:
      context: ./etl
      dockerfile: Dockerfile
    container_name: investbyyourself-etl-dev
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-dev_password_123}@postgres:5432/investbyyourself
      - REDIS_URL=redis://:${REDIS_PASSWORD:-dev_redis_123}@redis:6379/0
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY:-your_alpha_vantage_api_key}
      - FRED_API_KEY=${FRED_API_KEY:-your_fred_api_key}
    ports:
      - "8001:8001"
    volumes:
      - ./etl:/app
      - /app/__pycache__
    networks:
      - investbyyourself-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - etl

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  investbyyourself-dev:
    driver: bridge
