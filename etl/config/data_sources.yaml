# Data Sources Configuration
# InvestByYourself Financial Platform

data_sources:
  yahoo_finance:
    name: "Yahoo Finance"
    type: "market_data"
    base_url: "https://query1.finance.yahoo.com"
    api_key_required: false
    rate_limit: 1.0
    timeout: 30
    retry_attempts: 3
    data_types:
      - stock_prices
      - company_profiles
      - financials
      - market_cap
      - dividends
    coverage: "global"
    cost: "free"
    reliability: "high"

  alpha_vantage:
    name: "Alpha Vantage"
    type: "technical_indicators"
    base_url: "https://www.alphavantage.co/query"
    api_key_required: true
    rate_limit: 0.083  # 5 requests per minute
    timeout: 30
    retry_attempts: 3
    daily_limit: 250
    data_types:
      - technical_indicators
      - fundamental_data
      - news_sentiment
      - cryptocurrency
    coverage: "us_focus"
    cost: "free_tier"
    reliability: "high"

  fred:
    name: "Federal Reserve Economic Data"
    type: "economic_indicators"
    base_url: "https://api.stlouisfed.org/fred"
    api_key_required: true
    rate_limit: 2.0  # 120 requests per minute
    timeout: 30
    retry_attempts: 3
    data_types:
      - inflation
      - gdp
      - interest_rates
      - employment
      - monetary_policy
    coverage: "us"
    cost: "free"
    reliability: "very_high"

