    - "GDPC1"     # Real GDP
    - "GDPPOT"    # Real Potential GDP

  interest_rates:
    - "FEDFUNDS"  # Federal Funds Rate
    - "DGS10"     # 10-Year Treasury Rate
    - "DGS30"     # 30-Year Treasury Rate

  employment:
    - "UNRATE"    # Unemployment Rate
    - "PAYEMS"    # Total Nonfarm Payrolls
    - "CIVPART"   # Labor Force Participation Rate

  monetary_policy:
